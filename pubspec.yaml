name: safety_guard_app
description: "Safety Guard - Personal Safety & Emergency Assistance App (Modules 1-4: Foundation, Auth & Contacts, Safety Timer & Check-In, Emergency Dispatch)"
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # State management (MVVM: ViewModels extend ChangeNotifier)
  provider: ^6.1.2

  # Declarative routing / navigation shell
  go_router: ^14.2.0

  # Google "Material Symbols" equivalent — we use Material Icons bundled
  # with Flutter, so no extra icon package is required for Module 1.

  # --- Module 2: Authentication & Contacts ---
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4

  # --- Module 3: Safety Timer & Check-In ---
  # (session persistence reuses cloud_firestore above)

  # Generates local IDs for contacts/sessions before they round-trip
  # through Firestore (so the UI can render optimistically).
  uuid: ^4.5.1

  # --- Module 4: Emergency Dispatch ---
  # Device GPS location during an active session.
  geolocator: ^13.0.1
  # Launches the platform dialer (tel:), SMS composer (sms:), and Google
  # Maps (https://maps.google.com/...) without needing native permissions
  # beyond what the OS grants for opening another app.
  url_launcher: ^6.3.1
  # Local (on-device) notifications for check-in reminders and escalation
  # confirmations — NOT push notifications to a guardian's device, which
  # would require a server/Cloud Functions component. See README § "Module
  # 4 Limitations" for what a real push-based dispatch would still need.
  flutter_local_notifications: ^18.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  # NOTE (Module 1 scope):
  # The design references the "Inter" font. Add the actual .ttf files under
  # assets/fonts/ and uncomment the block below when the font files are
  # available. Until then the theme falls back to the platform font so the
  # app still builds and runs.
  #
  # fonts:
  #   - family: Inter
  #     fonts:
  #       - asset: assets/fonts/Inter-Regular.ttf
  #         weight: 400
  #       - asset: assets/fonts/Inter-SemiBold.ttf
  #         weight: 600
  #       - asset: assets/fonts/Inter-Bold.ttf
  #         weight: 700
  #
  # assets:
  #   - assets/images/
